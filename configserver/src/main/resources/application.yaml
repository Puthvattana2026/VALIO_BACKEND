server:
  port: 8083

spring:
  application:
    name: valio-configserver

  profiles:
    active: git

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Puthvattana2026/VALIO_BACKEND.git
          clone-on-start: true
          default-label: main
          search-paths: configserver/src/main/resources/configs

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"