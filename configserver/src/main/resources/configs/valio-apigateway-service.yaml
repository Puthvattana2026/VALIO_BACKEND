eureka:
   instance:
     preferIpAddress: true
       
   client:
     registerWithEureka: true
     fetchRegistry: true
     serviceUrl:
        defaultZone: http://localhost:8084/eureka/
        
management:
  endpoints:
    web:
      exposure:
        include: '*'

  endpoint:
    shutdown:
      enabled: true
    gateway:
      enabled: true